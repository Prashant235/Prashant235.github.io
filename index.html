<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prashant Kumbhar — Sr. Salesforce Solution Architect</title>
<script>
  (function(){
    var saved = null;
    try { saved = localStorage.getItem('pk-theme'); } catch(e){}
    var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    window.location.replace(theme === 'light' ? 'light.html' : 'dark.html');
  })();
</script>
</head>
<body>
  <noscript>
    <p>JavaScript is off, so pick a theme:</p>
    <p><a href="dark.html">Dark theme</a> — <a href="light.html">Light theme</a></p>
  </noscript>
</body>
</html>
